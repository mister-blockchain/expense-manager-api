<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Manager v2</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --input: #334155;
            --accent: #f43f5e;
            --accent-hover: #e11d48;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #475569;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 700px; }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .header h1 { font-size: 2rem; color: var(--accent); margin-bottom: 5px; }
        .header p { color: var(--text-muted); font-size: 0.9rem; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value { font-size: 1.5rem; font-weight: bold; }
        .stat-value.count { color: #60a5fa; }
        .stat-value.total { color: var(--accent); }
        .stat-value.avg { color: var(--success); }

        .add-form {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .add-form h3 {
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-row { display: flex; gap: 10px; }

        .form-row input {
            flex: 1;
            padding: 12px 15px;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        .form-row input:focus { border-color: var(--accent); }
        .form-row input::placeholder { color: var(--text-muted); }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .toolbar h3 {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            background: var(--input);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-sm:hover { background: var(--border); }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-danger:hover { background: var(--danger); color: white; }

        .expense-list { display: flex; flex-direction: column; gap: 8px; }

        .expense-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-card:hover { border-color: var(--accent); }

        .expense-left { display: flex; align-items: center; gap: 15px; }

        .expense-id {
            background: var(--input);
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .expense-desc { font-weight: 500; }

        .expense-right { display: flex; align-items: center; gap: 15px; }

        .expense-amount { font-weight: bold; font-size: 1.1rem; color: var(--accent); }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--card);
            border: 2px dashed var(--border);
            border-radius: 10px;
            color: var(--text-muted);
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 10px; }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Expense Manager v2</h1>
            <p>FastAPI + Pydantic + Full CRUD</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Total Items</div>
                <div class="stat-value count" id="stat-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Amount</div>
                <div class="stat-value total" id="stat-total">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average</div>
                <div class="stat-value avg" id="stat-avg">$0.00</div>
            </div>
        </div>

        <div class="add-form">
            <h3>📝 Add New Expense</h3>
            <div class="form-row">
                <input type="text" id="input-desc" placeholder="Description (e.g. Groceries)">
                <input type="number" id="input-amount" placeholder="Amount (e.g. 25.99)" step="0.01" min="0.01">
                <button class="btn btn-primary" onclick="addExpense()">+ Add</button>
            </div>
        </div>

        <div class="toolbar">
            <h3>📋 Expenses List</h3>
            <button class="btn btn-sm" onclick="loadAll()">🔄 Refresh</button>
        </div>

        <div class="expense-list" id="expense-list">
            <div class="empty-state">
                <div class="icon">🧾</div>
                <p>No expenses yet</p>
            </div>
        </div>

        <div class="footer">
            Built by <strong>Mister Blockchain</strong> •
            <a href="http://127.0.0.1:8000/docs" target="_blank">API Docs</a>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";

        window.onload = () => loadAll();

        function handleEnter(e) {
            if (e.key === "Enter") addExpense();
        }

        async function addExpense() {
            const desc = document.getElementById("input-desc").value.trim();
            const amt = document.getElementById("input-amount").value.trim();

            if (!desc || !amt) return alert("Fill both fields!");

            const res = await fetch(`${API}/expenses`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ description: desc, amount: parseFloat(amt) })
            });

            if (!res.ok) {
                const err = await res.json();
                return alert(typeof err.detail === "string" ? err.detail : JSON.stringify(err.detail));
            }

            document.getElementById("input-desc").value = "";
            document.getElementById("input-amount").value = "";
            loadAll();
        }

        async function loadAll() {
            try {
                const [expRes, sumRes] = await Promise.all([
                    fetch(`${API}/expenses`),
                    fetch(`${API}/summary`)
                ]);

                const expenses = await expRes.json();
                const summary = await sumRes.json();

                document.getElementById("stat-count").textContent = summary.total_expenses;
                document.getElementById("stat-total").textContent = `$${summary.total_amount}`;
                document.getElementById("stat-avg").textContent = `$${summary.average_amount}`;

                renderExpenses(Array.isArray(expenses) ? expenses : []);
            } catch (err) {
                document.getElementById("expense-list").innerHTML = `
                    <div class="empty-state"><div class="icon">⚠️</div><p>Connection Error</p></div>`;
            }
        }

        function renderExpenses(expenses) {
            const list = document.getElementById("expense-list");

            if (expenses.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="icon">🧾</div><p>No expenses yet</p></div>`;
                return;
            }

            list.innerHTML = expenses.reverse().map(e => `
                <div class="expense-card">
                    <div class="expense-left">
                        <span class="expense-id">#${e.id}</span>
                        <span class="expense-desc">${e.description}</span>
                    </div>
                    <div class="expense-right">
                        <span class="expense-amount">$${parseFloat(e.amount).toFixed(2)}</span>
                        <button class="btn-danger" onclick="deleteExpense(${e.id})">🗑️</button>
                    </div>
                </div>
            `).join("");
        }

        async function deleteExpense(id) {
            if (!confirm(`Delete #${id}?`)) return;
            await fetch(`${API}/expenses/${id}`, { method: "DELETE" });
            loadAll();
        }
    </script>
</body>
</html>
